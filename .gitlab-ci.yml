# gitlab-ci.yaml documentation
# https://docs.gitlab.com/ee/ci/yaml/

stages:
  - release

variables:
  BIN_NAME: "logslate"
  PACKAGE_VERSION: $CI_COMMIT_TAG
  LINUX_AMD64_BINARY: "${BIN_NAME}-linux-amd64"
  DARWIN_AMD64_BINARY: "${BIN_NAME}-darwin-amd64"
  WINDOWS_AMD64_BINARY: "${BIN_NAME}-windows-amd64.exe"
  PACKAGE_API_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages"
  PACKAGE_REGISTRY_CURRENT: "${PACKAGE_API_URL}/generic/${BIN_NAME}/${PACKAGE_VERSION}"
  PACKAGE_REGISTRY_LATEST: "${PACKAGE_API_URL}/generic/${BIN_NAME}/latest"
  BREW_BIN: $BIN_NAME
  BREW_DESCRIPTION: "Logslate (log translate)"
  BREW_BOT_EMAIL: "gnufred+gitlab-ci@gmail.com"
  BREW_GITLAB_URL: "gitlab.com/gnufred/logslate"  

release:
  image: golang:1.20
  stage: release
  only:
    - tags
  script:
    - .gitlab/vuln
    - .gitlab/lint
    - .gitlab/test
    - .gitlab/cover
    - .gitlab/build
    - .gitlab/package
    - .gitlab/release
    - .brew/release
