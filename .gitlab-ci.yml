stages:
  - test
  - release

variables:
  BIN_NAME: "logslate"
  PACKAGE_VERSION: $CI_COMMIT_TAG
  LINUX_AMD64_BINARY: "${BIN_NAME}-linux-amd64"
  DARWIN_AMD64_BINARY: "${BIN_NAME}-darwin-amd64"
  WINDOWS_AMD64_BINARY: "${BIN_NAME}-windows-amd64.exe"
  PACKAGE_API_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages"
  PACKAGE_REGISTRY_URL: "${PACKAGE_API_URL}/generic/${BIN_NAME}/${PACKAGE_VERSION}"
  BREW_BOT_EMAIL: "gnufred+gitlab-ci@gmail.com"
  BREW_GITLAB_URL: "gitlab.com/gnufred/logslate"

default:
  image: golang:1.20

test:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
  script: 
    - gitlab/test

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script: 
    - gitlab/build
    - gitlab/upload
    - gitlab/release
    - brew/release
